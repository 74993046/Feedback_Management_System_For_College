<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRUCTUDE - Student Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { min-height:100vh; background:linear-gradient(135deg,#eef2ff,#f8fafc); }
.card { border:0; border-radius:18px; }
.brand { font-weight:800; letter-spacing:1px; }
</style>
</head>
<body class="d-flex align-items-center">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow p-4">
        <div class="text-center mb-4">
          <h2 class="brand">GPK COD</h2>
          <p class="text-muted mb-0">Student Feedback Management System</p>
        </div>
        <form action="student-login" method="post">
          <label class="form-label">Enrollment Number</label>
          <input class="form-control form-control-lg mb-3" type="text"
                 name="enrollment" maxlength="20" required autofocus>
          <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
